# Publish workflow for the Smart Tests CLI
# Builds and publishes packages to PyPI and Docker Hub

name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  IMAGE_NAME: cloudbees/smart-tests-cli

jobs:
  tagpr:
    permissions:
      actions: write
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.run-tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@v4.2.2
      - id: run-tagpr
        uses: Songmu/tagpr@v1.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pypi:
    needs: tagpr
    if: needs.tagpr.outputs.tag != '' || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v3.2.4

      - name: Build package
        run: uv build
      - name: Publish to PyPI
        run: uv publish --token ${{ secrets.SMART_TESTS_PYPI_API_TOKEN }}
  docker:
    name: Push Docker image to Docker Hub
    needs: tagpr
    if: needs.tagpr.outputs.tag != '' || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-22.04

    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4.2.2

      - name: Log in to Docker Hub
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest,${{ env.IMAGE_NAME }}:${{ needs.tagpr.outputs.tag }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2.4.0
        with:
          subject-name: index.docker.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

name: Update maven_install.json
on:
  pull_request:
    paths:
      - "MODULE.bazel"
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Bazel
        uses: bazelbuild/setup-bazelisk@v3.0.0
      - name: Cache Bazel outputs
        uses: actions/cache@v4.2.3
        with:
          path: "~/.cache/bazel"
          key: bazel
      - name: Update maven_install.json
        run: |
          REPIN=1 bazel run @unpinned_maven//:pin
      - name: Commit updated files
        if: ${{ !cancelled() }}
        uses: iarekylew00t/verified-bot-commit@v2.3.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: src/maven_install.json
          message: "Update maven_install.json"

name: Bazel test
on:
  push:
    branches:
      - main
    paths:
      - "MODULE.bazel"
      - "src/**"
      - "!src/**.md"
      - ".github/workflows/bazel-test.yml"
  pull_request:
    paths:
      - "MODULE.bazel"
      - "src/**"
      - "!src/**.md"
      - ".github/workflows/bazel-test.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set up JDK 8
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "8"
      - name: Setup Bazel
        uses: bazelbuild/setup-bazelisk@v3.0.0
      - name: Cache Bazel outputs
        uses: actions/cache@v4.2.3
        with:
          path: "~/.cache/bazel"
          key: bazel
      - name: Run Bazel test
        run: |
          bazel test //...
      - name: Check exe_deploy.jar is up to date
        run: |
          bazel build //src/main/java/com/launchableinc/ingest/commits:exe_deploy.jar
          if ! diff -q bazel-bin/src/main/java/com/launchableinc/ingest/commits/exe_deploy.jar smart_tests/jar/exe_deploy.jar > /dev/null 2>&1; then
            echo "smart_tests/jar/exe_deploy.jar is out of date. Run build-java.sh to update it."
            exit 1
          fi

      - name: Upload test results
        uses: cloudbees-oss/smart-tests-results-upload-action@v1.3.0
        if: always()

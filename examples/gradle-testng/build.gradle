plugins {
    id 'java'
}

group = 'com.cloudbees.smarttests.example'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    testImplementation 'org.testng:testng:6.14.3'

    // The TestNG listener reads LAUNCHABLE_SUBSET_FILE_PATH and limits execution
    // to the
    // fully-qualified class names in that file.
    testRuntimeOnly 'com.launchableinc:launchable-testng:1.3.0'
}

tasks.named('test') {
    useTestNG {
        // Gradle does not discover TestNG listeners from META-INF/services, so
        // register the adapter explicitly.
        listeners << 'com.launchableinc.testng.TestSelector'
    }

    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}
